<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Caveat:wght@700&family=Figtree:wght@600&display=swap" rel="stylesheet" />
<style>
  /* Imagen para compartir (Open Graph) 1200x630: texto a la izquierda, dibujo a la derecha. */
  :root { --bg: oklch(0.964 0.017 85); --fg: oklch(0.2 0.01 60); --accent: oklch(0.62 0.17 45); --hl: oklch(0.88 0.15 95); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--fg); }
  .stage { position: relative; width: 1200px; height: 630px; padding: 56px 64px; display: grid; grid-template-columns: 560px 1fr; gap: 32px; align-items: center; }
  .marca { position: absolute; top: 48px; left: 64px; display: flex; align-items: center; gap: 12px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 22px; line-height: 1; }
  .marca img { height: 58px; }
  .texto { margin-top: 40px; }
  .kicker { font-family: Caveat, cursive; font-weight: 700; font-size: 38px; color: var(--accent); line-height: 1.05; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 64px; line-height: 1.02; letter-spacing: -0.015em; margin-top: 10px; text-wrap: balance; }
  .mk { background: linear-gradient(transparent 56%, color-mix(in oklab, var(--hl) 85%, transparent) 56%, color-mix(in oklab, var(--hl) 85%, transparent) 90%, transparent 90%); padding: 0 .06em; }
  .sub { font-family: Figtree, sans-serif; font-weight: 600; font-size: 24px; margin-top: 18px; color: oklch(0.38 0.02 60); }
  .url { position: absolute; left: 64px; bottom: 44px; font-family: Figtree, sans-serif; font-weight: 600; font-size: 24px; }
  .url span { color: var(--accent); }
  .dibujo { width: 100%; height: 470px; display: flex; align-items: center; justify-content: center; }
  .dibujo img { max-width: 100%; max-height: 100%; mix-blend-mode: multiply;
    -webkit-mask-image: radial-gradient(ellipse 72% 72% at center, #000 62%, transparent 100%);
    mask-image: radial-gradient(ellipse 72% 72% at center, #000 62%, transparent 100%); }
</style>
</head>
<body>
<div class="stage">
  <div class="marca"><img src="/public/logo-ci.png" alt="" />Cultura de<br />Innovación</div>
  <div class="texto">
    <p class="kicker" id="kicker"></p>
    <h1 id="titulo"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="dibujo"><img id="img" alt="" /></div>
  <p class="url">culturadeinnovacion.com <span>→</span></p>
</div>
<script>
  const P = {
    inicio: ["para líderes de innovación y producto", 'Innova con <span class="mk">evidencia</span>, no con corazonadas.', "", "/src/assets/hero-team.jpg"],
    brujula: ["app Brújula de Innovación", 'Deja de adivinar <span class="mk">qué construir</span>.', "Valida tu idea con clientes reales antes de construirla.", "/src/assets/discovery-path.jpg"],
    servicios: ["consultoría · Human Momentum", 'Te <span class="mk">acompañamos</span> en el camino.', "", "/docs/marca/og/equipo.png"],
    podcast: ["podcast con Nicolás Ramírez", 'Conversaciones que <span class="mk">mueven</span> la innovación.', "", "/src/assets/podcast-sketch.jpg"],
    planes: ["app Brújula de Innovación", 'Elige tu <span class="mk">plan</span>', "Startup gratis · Plus y Empresarial: consúltanos", "/docs/marca/og/app.png"],
  };
  const [k, t, s, img] = P[location.hash.slice(1)] || P.inicio;
  kicker.textContent = k; titulo.innerHTML = t; sub.textContent = s; document.getElementById("img").src = img;
</script>
</body>
</html>
